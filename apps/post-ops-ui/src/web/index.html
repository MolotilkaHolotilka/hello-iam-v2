<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Remotion Render MVP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;700&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="mvp-body">
    <main class="mvp-shell">
      <header class="mvp-header mvp-header-with-nav">
        <div>
          <p class="mvp-kicker">HELLOIAM.AM</p>
          <h1>Remotion Render MVP</h1>
        </div>
        <nav id="mvp-top-nav" class="mvp-top-nav" aria-label="Main navigation"></nav>
      </header>

      <section class="mvp-controls" aria-label="Render controls">
        <label class="mvp-field">
          <span>Template</span>
          <select id="template-select"></select>
        </label>

        <label class="mvp-field">
          <span>Animation preset</span>
          <select id="animation-preset"></select>
        </label>
      </section>

      <article class="mvp-panel mvp-template-panel" aria-label="Template cards">
        <div class="mvp-panel-head">
          <div>
            <h2>Template cards</h2>
            <p id="content-file-label" class="mvp-content-file-label">Using template default content.</p>
          </div>
          <input id="content-file" type="file" accept=".json,application/json" />
        </div>
        <div id="template-cards-grid" class="mvp-template-cards-grid"></div>
      </article>

      <div class="mvp-run-row">
        <button id="run-render" class="mvp-run-button" type="button">
          Run Render
        </button>
      </div>

      <section id="status-box" class="mvp-status-box" data-tone="neutral"></section>

      <section id="output-panel" class="mvp-output" hidden>
        <div class="mvp-output-toolbar" role="toolbar" aria-label="Output view and downloads">
          <div class="mvp-output-toolbar-start">
            <div class="mvp-output-toolbar-toggles" role="group" aria-label="Preview type">
              <button
                id="btn-show-images"
                type="button"
                class="mvp-output-toolbar-btn mvp-output-toolbar-toggle mvp-output-toolbar-toggle--active"
              >
                Show Images
              </button>
              <button
                id="btn-show-video"
                type="button"
                class="mvp-output-toolbar-btn mvp-output-toolbar-toggle"
              >
                Show Video
              </button>
            </div>
            <button
              id="btn-download-png"
              type="button"
              class="mvp-output-toolbar-btn mvp-output-toolbar-download"
            >
              Download PNG
            </button>
            <button
              id="btn-download-mp4"
              type="button"
              class="mvp-output-toolbar-btn mvp-output-toolbar-download mvp-hidden"
            >
              Download MP4
            </button>
          </div>
          <button
            id="btn-download-all"
            type="button"
            class="mvp-output-toolbar-btn mvp-output-toolbar-all"
          >
            Download All
          </button>
        </div>
        <div class="mvp-preview-grid">
          <img id="png-preview" alt="PNG preview" hidden />
          <video id="mp4-preview" controls hidden></video>
        </div>
        <pre id="props-preview" class="mvp-props-preview"></pre>
      </section>
    </main>

    <script type="module" src="/mvp-app.js"></script>
  </body>
</html>
