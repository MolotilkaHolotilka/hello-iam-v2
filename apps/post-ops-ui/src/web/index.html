<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Remotion Render MVP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;700&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="mvp-body">
    <main class="mvp-shell">
      <header class="mvp-header mvp-header-with-nav">
        <div>
          <p class="mvp-kicker">HELLOIAM.AM</p>
          <h1>Remotion Render MVP</h1>
        </div>
        <nav id="mvp-top-nav" class="mvp-top-nav" aria-label="Main navigation"></nav>
      </header>

      <section class="mvp-controls" aria-label="Render controls">
        <label class="mvp-field">
          <span>Template <span id="template-demo-badge" class="mvp-demo-badge" hidden>Demo</span></span>
          <select id="template-select"></select>
        </label>

        <label id="animation-preset-field" class="mvp-field mvp-control-advanced">
          <span>Animation preset</span>
          <select id="animation-preset"></select>
        </label>
      </section>

      <section
        id="content-cards-section"
        class="mvp-cards-section mvp-studio-section"
        aria-label="Studio editor"
        hidden
      >
        <div class="mvp-cards-section-head">
          <div>
            <h2>Studio</h2>
            <p id="content-cards-hint" class="mvp-cards-hint">Loading content...</p>
          </div>
          <p id="content-file-label" class="mvp-content-file-label">Using saved template content.</p>
        </div>
        <p id="demo-banner" class="mvp-demo-banner" hidden>
          Built-in demo — edit optional
        </p>
        <p id="content-cards-error" class="mvp-cards-error" hidden></p>
        <div
          id="content-cards-carousel-shell"
          class="mvp-cards-carousel-shell"
          hidden
          aria-label="Card preview carousel"
        >
          <button
            type="button"
            class="mvp-carousel-arrow mvp-carousel-arrow-side"
            data-carousel-nav="prev"
            aria-label="Previous card"
          >
            ←
          </button>
          <div class="mvp-cards-carousel-viewport" id="content-cards-carousel-viewport">
            <div class="mvp-cards-carousel-track" id="content-cards-carousel-track"></div>
          </div>
          <button
            type="button"
            class="mvp-carousel-arrow mvp-carousel-arrow-side"
            data-carousel-nav="next"
            aria-label="Next card"
          >
            →
          </button>
        </div>
        <details id="studio-editor-details" class="mvp-studio-advanced">
          <summary class="mvp-studio-advanced-summary">Edit content (optional)</summary>
          <div id="content-root-fields" class="mvp-cards-root-fields"></div>
          <div class="mvp-cards-nav" id="content-cards-nav"></div>
          <article id="content-card-panel" class="mvp-card-panel"></article>
        </details>
      </section>

      <div class="mvp-run-row">
        <button id="save-content" class="mvp-secondary-button" type="button" disabled>
          Save Content
        </button>
        <label class="mvp-quick-render-toggle" for="quick-render">
          <input id="quick-render" type="checkbox" />
          <span>Quick render (1 card, PNG only)</span>
        </label>
        <button id="run-render" class="mvp-run-button" type="button">
          Run Render
        </button>
      </div>

      <section id="status-box" class="mvp-status-box" data-tone="neutral"></section>

      <section id="output-panel" class="mvp-output" hidden>
        <p id="quick-render-note" class="mvp-quick-render-note" hidden>
          Quick mode — 1 card PNG only
        </p>
        <div class="mvp-output-toolbar" role="toolbar" aria-label="Output view and downloads">
          <div class="mvp-output-toolbar-start">
            <div class="mvp-output-toolbar-toggles" role="group" aria-label="Preview type">
              <button
                id="btn-show-images"
                type="button"
                class="mvp-output-toolbar-btn mvp-output-toolbar-toggle mvp-output-toolbar-toggle--active"
              >
                Show Images
              </button>
              <button
                id="btn-show-video"
                type="button"
                class="mvp-output-toolbar-btn mvp-output-toolbar-toggle"
              >
                Show Video
              </button>
            </div>
            <button
              id="btn-download-png"
              type="button"
              class="mvp-output-toolbar-btn mvp-output-toolbar-download"
            >
              Download PNG
            </button>
            <button
              id="btn-download-mp4"
              type="button"
              class="mvp-output-toolbar-btn mvp-output-toolbar-download mvp-hidden"
            >
              Download MP4
            </button>
          </div>
          <button
            id="btn-download-all"
            type="button"
            class="mvp-output-toolbar-btn mvp-output-toolbar-all"
          >
            Download All
          </button>
        </div>
        <div class="mvp-preview-grid">
          <img id="png-preview" alt="PNG preview" hidden />
          <video id="mp4-preview" controls hidden></video>
        </div>
        <pre id="props-preview" class="mvp-props-preview"></pre>
      </section>
    </main>

    <script type="module" src="/mvp-app.js"></script>
  </body>
</html>
